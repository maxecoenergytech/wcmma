# Dependabot Configuration for WCMAA India
# Automated vulnerability detection and package maintenance
version: 2
updates:
  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 5
    reviewers:
      - "maxecoenergytech"
    labels:
      - "security"
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # Maintain GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Kolkata"
    open-pull-requests-limit: 3
    reviewers:
      - "maxecoenergytech"
    labels:
      - "security"
      - "actions"
    commit-message:
      prefix: "ci(actions)"
